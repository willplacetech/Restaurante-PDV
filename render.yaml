services:
  - type: web
    runtime: node
    name: pdv-restaurante-api
    branch: main
    region: oregon
    plan: free
    rootDir: back-end
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api
    envVars:
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        value: https://pdv-restaurante-demo.onrender.com

  - type: web
    runtime: static
    name: pdv-restaurante-demo
    branch: main
    rootDir: front-end
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pdv-restaurante-api.onrender.com/api